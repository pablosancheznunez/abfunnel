# Builds the pkgdown site on every change to main and publishes it, so the
# documentation always matches the code.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build the site
        run: Rscript -e 'pkgdown::build_site(".", override = list(destination = "_site"), new_process = FALSE, install = FALSE)'
      - name: Add an example report
        run: Rscript -e 'library(abfunnel); dir.create("_site/example"); af_report(experiment_demo, "_site/example/report.html", title = "Checkout call-to-action test (synthetic data)", hypothesis = "A clearer call to action increases purchases.", design = af_design(0.04, 0.10), funnel = af_funnel(funnel_demo))'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
